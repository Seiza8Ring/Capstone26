<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GlobalSpeak • Translator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <script type="text/javascript" src="eel.js"></script>
</head>
<body class="bg-slate-200 text-slate-900">
  <div class="window-shell">
    <div class="titlebar">
      <div class="title-drag"><i data-lucide="globe-2"></i><span>GlobalSpeak</span></div>
      <div class="controls">
        <button class="ctrl" id="btnMin"><i data-lucide="minus"></i></button>
        <button class="ctrl" id="btnMax"><i data-lucide="square"></i></button>
        <button class="ctrl" id="btnFull"><i data-lucide="maximize-2"></i></button>
        <button class="ctrl close" id="btnClose"><i data-lucide="x"></i></button>
      </div>
    </div>
    <div class="window-content">
  <div class="min-h-[calc(100vh-40px)] grid grid-cols-1 md:grid-cols-[260px_1fr]">
    <aside class="bg-white border-r border-slate-200 p-4 md:p-6 hidden md:block">
      <a class="flex items-center gap-2" href="/index.html">
        <div class="w-8 h-8 rounded-lg bg-blue-600 text-white grid place-items-center shadow-sm">
          <i data-lucide="globe-2" class="w-5 h-5"></i>
        </div>
        <span class="font-semibold tracking-tight">GlobalSpeak</span>
      </a>
      <nav class="flex flex-col gap-1 mt-6">
        <a class="nav-link" href="/index.html"><i data-lucide="layout-dashboard"></i>Dashboard</a>
        <a class="nav-link active" href="/translator.html"><i data-lucide="languages"></i>Translator</a>
        <a class="nav-link" href="/assistant.html"><i data-lucide="message-circle"></i>Assistant</a>
      </nav>
    </aside>

    <main class="p-4 md:p-8">
      <header class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-semibold">Translator</h1>
        <a class="btn ghost" href="/assistant.html"><i data-lucide="message-circle"></i><span>Assistant</span></a>
      </header>

      <section class="card">
        <div class="grid gap-4">
          <div>
            <label class="label">From (auto-detect)</label>
            <textarea id="inputText" class="input" rows="5" placeholder="Type or paste your text..."></textarea>
          </div>
          <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-end">
            <div class="flex-1">
              <label class="label">To</label>
              <select id="targetLang" class="input"></select>
            </div>
            <button id="translateBtn" class="btn"><i data-lucide="arrow-right"></i><span>Translate</span></button>
          </div>
          <div>
            <label class="label">Translated</label>
            <textarea id="outputText" class="input bg-slate-100" rows="5" readonly></textarea>
          </div>
        </div>
      </section>
    </main>
  </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>
    const langs = {
      'Afrikaans':'af','Albanian':'sq','Arabic':'ar','Bulgarian':'bg','Chinese (Simplified)':'zh-cn','Chinese (Traditional)':'zh-tw','Czech':'cs','Danish':'da','Dutch':'nl','English':'en','Estonian':'et','Finnish':'fi','French':'fr','German':'de','Greek':'el','Hebrew':'he','Hindi':'hi','Hungarian':'hu','Indonesian':'id','Italian':'it','Japanese':'ja','Korean':'ko','Latvian':'lv','Lithuanian':'lt','Norwegian':'no','Polish':'pl','Portuguese':'pt','Romanian':'ro','Russian':'ru','Spanish':'es','Swedish':'sv','Thai':'th','Turkish':'tr','Ukrainian':'uk','Urdu':'ur','Vietnamese':'vi'
    };

    const sel = document.getElementById('targetLang');
    Object.entries(langs).forEach(([name, code]) => {
      const opt = document.createElement('option');
      opt.value = code; opt.textContent = name; sel.appendChild(opt);
    });
    sel.value = 'es';

    const btn = document.getElementById('translateBtn');
    const input = document.getElementById('inputText');
    const output = document.getElementById('outputText');

    btn.addEventListener('click', async () => {
      const text = input.value.trim();
      const target = sel.value;
      if (!text) { output.value = 'Please enter some text.'; return; }
      btn.disabled = true; btn.querySelector('span').textContent = 'Translating…';
      try {
        let translatedText = null;
        if (typeof eel !== 'undefined' && eel.translate) {
          const res = await eel.translate(text, target)();
          if (res && res.ok) {
            translatedText = res.text;
          } else if (res && res.error) {
            throw new Error(res.error);
          }
        }
        // Fallback to client-side fetch if Eel not available or failed
        if (!translatedText) {
          const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${encodeURIComponent(target)}&dt=t&q=${encodeURIComponent(text)}`;
          const r = await fetch(url);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const data = await r.json();
          translatedText = data[0].map(seg => seg[0]).join('');
        }
        output.value = translatedText;
        const hist = JSON.parse(localStorage.getItem('gs_history')||'[]');
        hist.unshift({t: Date.now(), src: text, tgt: translatedText, lang: target});
        localStorage.setItem('gs_history', JSON.stringify(hist.slice(0, 20)));
      } catch (e) {
        output.value = 'Error: ' + e;
      } finally {
        btn.disabled = false; btn.querySelector('span').textContent = 'Translate';
      }
    });
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
