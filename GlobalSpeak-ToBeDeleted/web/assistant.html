<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GlobalSpeak • Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script type="text/javascript" src="eel.js"></script>
</head>
<body class="bg-slate-200 text-slate-900">
  <div class="window-shell">
    <div class="titlebar">
      <div class="title-drag"><i data-lucide="globe-2"></i><span>GlobalSpeak</span></div>
      <div class="controls">
        <button class="ctrl" id="btnMin"><i data-lucide="minus"></i></button>
        <button class="ctrl" id="btnMax"><i data-lucide="square"></i></button>
        <button class="ctrl" id="btnFull"><i data-lucide="maximize-2"></i></button>
        <button class="ctrl close" id="btnClose"><i data-lucide="x"></i></button>
      </div>
    </div>
    <div class="window-content">
  <div class="min-h-[calc(100vh-40px)] grid grid-cols-1 md:grid-cols-[260px_1fr]">
    <aside class="bg-white border-r border-slate-200 p-4 md:p-6 hidden md:block">
      <a class="flex items-center gap-2" href="/index.html">
        <div class="w-8 h-8 rounded-lg bg-blue-600 text-white grid place-items-center shadow-sm">
          <i data-lucide="globe-2" class="w-5 h-5"></i>
        </div>
        <span class="font-semibold tracking-tight">GlobalSpeak</span>
      </a>
      <nav class="flex flex-col gap-1 mt-6">
        <a class="nav-link" href="index.html"><i data-lucide="layout-dashboard"></i>Dashboard</a>
        <a class="nav-link" href="translator.html"><i data-lucide="languages"></i>Translator</a>
        <a class="nav-link active" href="assistant.html"><i data-lucide="message-circle"></i>Assistant</a>
      </nav>
    </aside>

    <main class="p-4 md:p-8">
      <header class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-semibold">Assistant</h1>
        <button id="promptBtn" class="btn ghost"><i data-lucide="sparkles"></i><span>Prompt</span></button>
      </header>

      <section class="card h-[70vh] flex flex-col">
        <div id="chat" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
        <form id="chatForm" class="mt-3 flex items-end gap-2">
          <textarea id="msg" class="input flex-1" rows="2" placeholder="Ask something…"></textarea>
          <button class="btn" type="submit"><i data-lucide="send"></i><span>Send</span></button>
        </form>
      </section>
    </main>
  </div>
    </div>
  </div>

  <!-- Prompt Modal -->
  <dialog id="promptModal" class="modal">
    <form method="dialog" class="modal-box">
      <h3 class="font-semibold mb-2">Custom System Prompt</h3>
      <textarea id="systemPrompt" class="input" rows="6"></textarea>
      <div class="mt-3 flex justify-end gap-2">
        <button value="cancel" class="btn ghost">Cancel</button>
        <button id="savePrompt" value="default" class="btn">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
  <script>
    const chatEl = document.getElementById('chat');
    const form = document.getElementById('chatForm');
    const msgEl = document.getElementById('msg');
    const promptBtn = document.getElementById('promptBtn');
    const modal = document.getElementById('promptModal');
    const systemPromptEl = document.getElementById('systemPrompt');

    let systemPrompt = localStorage.getItem('gs_system_prompt') || 'You are GlobalSpeak Assistant: concise, helpful, multilingual.';
    systemPromptEl.value = systemPrompt;

    promptBtn.addEventListener('click', () => modal.showModal());
    document.getElementById('savePrompt').addEventListener('click', (e) => {
      e.preventDefault();
      systemPrompt = systemPromptEl.value.trim() || systemPrompt;
      localStorage.setItem('gs_system_prompt', systemPrompt);
      modal.close();
    });

    const messages = [];

    function bubble(role, content){
      const wrap = document.createElement('div');
      wrap.className = 'w-full flex ' + (role==='user'?'justify-end':'justify-start');
      const b = document.createElement('div');
      b.className = 'max-w-[80%] rounded-2xl px-4 py-2 text-sm ' + (role==='user'?'bg-blue-600 text-white':'bg-slate-100 text-slate-800');
      b.textContent = content;
      wrap.appendChild(b);
      chatEl.appendChild(wrap);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = msgEl.value.trim();
      if(!text) return;
      messages.push({role:'user', content:text});
      bubble('user', text);
      msgEl.value='';

      // typing placeholder
      const typing = document.createElement('div');
      typing.className = 'w-full flex justify-start';
      typing.innerHTML = '<div class="max-w-[80%] rounded-2xl px-4 py-2 text-sm bg-slate-100 text-slate-500 italic">Assistant is typing…</div>';
      chatEl.appendChild(typing); chatEl.scrollTop = chatEl.scrollHeight;

      try{
        if (typeof eel === 'undefined' || !eel.assistant_reply) {
          throw new Error('Assistant backend unavailable. Ensure the app is launched via Python/Eel.');
        }
        const res = await eel.assistant_reply(JSON.stringify(messages), systemPrompt)();
        typing.remove();
        if(res.ok){
          const reply = res.text;
          messages.push({role:'assistant', content:reply});
          bubble('assistant', reply);
        } else {
          bubble('assistant', 'Error: '+res.error);
        }
      }catch(err){
        typing.remove();
        bubble('assistant', 'Error: '+err);
      }
    });
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
