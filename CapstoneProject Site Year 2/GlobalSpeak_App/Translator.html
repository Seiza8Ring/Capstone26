<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalSpeak Web Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Main container for the translator app -->
    <div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-2xl">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">GlobalSpeak Web Translator</h1>

        <!-- Input Section -->
        <div class="mb-6">
            <label for="input_text" class="block text-gray-700 font-semibold mb-2">From: (auto-detected)</label>
            <textarea id="input_text" rows="5" placeholder="Type or paste your text here..."
                      class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-200"></textarea>
        </div>

        <!-- Language Selection and Translate Button -->
        <div class="flex flex-col sm:flex-row items-center justify-between mb-6 space-y-4 sm:space-y-0 sm:space-x-4">
            <div class="flex items-center w-full sm:w-auto">
                <label for="lang_select" class="text-gray-700 font-semibold mr-2 whitespace-nowrap">To:</label>
                <select id="lang_select"
                        class="flex-grow p-2 rounded-lg border border-gray-300 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-200">
                </select>
            </div>
            <button id="translate_button"
                    class="w-full sm:w-auto px-6 py-3 bg-blue-600 text-white font-bold rounded-lg shadow-md hover:bg-blue-700 transition-colors duration-200">
                Translate
            </button>
        </div>

        <!-- Output Section -->
        <div>
            <label for="output_text" class="block text-gray-700 font-semibold mb-2">Translated text:</label>
            <textarea id="output_text" rows="5" readonly
                      class="w-full p-3 rounded-lg border border-gray-300 bg-gray-50 text-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-200"></textarea>
        </div>
    </div>

    <!-- JavaScript for the translation logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // A much more comprehensive list of languages.
            // The Google Translate API supports many more, which can be added here.
            const languages = {
                'Afrikaans': 'af', 'Albanian': 'sq', 'Amharic': 'am', 'Arabic': 'ar', 'Armenian': 'hy',
                'Azerbaijani': 'az', 'Basque': 'eu', 'Belarusian': 'be', 'Bengali': 'bn', 'Bosnian': 'bs',
                'Bulgarian': 'bg', 'Catalan': 'ca', 'Cebuano': 'ceb', 'Chinese (Simplified)': 'zh-cn',
                'Chinese (Traditional)': 'zh-tw', 'Corsican': 'co', 'Croatian': 'hr', 'Czech': 'cs',
                'Danish': 'da', 'Dutch': 'nl', 'English': 'en', 'Esperanto': 'eo', 'Estonian': 'et',
                'Finnish': 'fi', 'French': 'fr', 'Frisian': 'fy', 'Galician': 'gl', 'Georgian': 'ka',
                'German': 'de', 'Greek': 'el', 'Gujarati': 'gu', 'Haitian Creole': 'ht', 'Hausa': 'ha',
                'Hawaiian': 'haw', 'Hebrew': 'he', 'Hindi': 'hi', 'Hmong': 'hmn', 'Hungarian': 'hu',
                'Icelandic': 'is', 'Igbo': 'ig', 'Indonesian': 'id', 'Irish': 'ga', 'Italian': 'it',
                'Japanese': 'ja', 'Javanese': 'jw', 'Kannada': 'kn', 'Kazakh': 'kk', 'Khmer': 'km',
                'Kinyarwanda': 'rw', 'Korean': 'ko', 'Kurdish': 'ku', 'Kyrgyz': 'ky', 'Lao': 'lo',
                'Latin': 'la', 'Latvian': 'lv', 'Lithuanian': 'lt', 'Luxembourgish': 'lb', 'Macedonian': 'mk',
                'Malagasy': 'mg', 'Malay': 'ms', 'Malayalam': 'ml', 'Maltese': 'mt', 'Maori': 'mi',
                'Marathi': 'mr', 'Mongolian': 'mn', 'Myanmar (Burmese)': 'my', 'Nepali': 'ne',
                'Norwegian': 'no', 'Nyanja (Chichewa)': 'ny', 'Odia (Oriya)': 'or', 'Pashto': 'ps',
                'Persian': 'fa', 'Polish': 'pl', 'Portuguese': 'pt', 'Punjabi': 'pa', 'Romanian': 'ro',
                'Russian': 'ru', 'Samoan': 'sm', 'Scots Gaelic': 'gd', 'Serbian': 'sr', 'Sesotho': 'st',
                'Shona': 'sn', 'Sindhi': 'sd', 'Sinhala (Sinhalese)': 'si', 'Slovak': 'sk', 'Slovenian': 'sl',
                'Somali': 'so', 'Spanish': 'es', 'Sundanese': 'su', 'Swahili': 'sw', 'Swedish': 'sv',
                'Tagalog (Filipino)': 'tl', 'Tajik': 'tg', 'Tamil': 'ta', 'Tatar': 'tt', 'Telugu': 'te',
                'Thai': 'th', 'Turkish': 'tr', 'Turkmen': 'tk', 'Ukrainian': 'uk', 'Urdu': 'ur',
                'Uyghur': 'ug', 'Uzbek': 'uz', 'Vietnamese': 'vi', 'Welsh': 'cy', 'Xhosa': 'xh',
                'Yiddish': 'yi', 'Yoruba': 'yo', 'Zulu': 'zu'
            };

            const langSelect = document.getElementById('lang_select');
            const inputText = document.getElementById('input_text');
            const outputText = document.getElementById('output_text');
            const translateButton = document.getElementById('translate_button');

            // Populate the language dropdown
            for (const lang in languages) {
                const option = document.createElement('option');
                option.value = languages[lang];
                option.textContent = lang;
                langSelect.appendChild(option);
            }

            // Function to handle the translation
            async function translateText() {
                const textToTranslate = inputText.value.trim();
                const targetLangCode = langSelect.value;
                
                if (!textToTranslate) {
                    outputText.value = "Please enter some text to translate.";
                    return;
                }

                try {
                    translateButton.textContent = 'Translating...';
                    translateButton.disabled = true;

                    // A simple workaround to avoid using a library and make a direct API call
                    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLangCode}&dt=t&q=${encodeURIComponent(textToTranslate)}`;
                    
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();

                    // The translation is in the first element of the nested array
                    const translatedText = data[0].map(item => item[0]).join('');
                    outputText.value = translatedText;

                } catch (error) {
                    console.error("Translation failed:", error);
                    outputText.value = `An error occurred: ${error.message}. Please check your internet connection or try again later.`;
                } finally {
                    translateButton.textContent = 'Translate';
                    translateButton.disabled = false;
                }
            }

            translateButton.addEventListener('click', translateText);

            // Optional: Translate on Enter key press in the input box
            inputText.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    translateText();
                }
            });
        });
    </script>
</body>
</html>
